name: iOS

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run tests on the simulator
        run: |
          xcodebuild test \
            -project 'KDE Connect.xcodeproj' \
            -scheme 'KDE Connect' \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:'KDE ConnectTests' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Archive without signing
        run: |
          xcodebuild archive \
            -project 'KDE Connect.xcodeproj' \
            -scheme 'KDE Connect' \
            -destination 'generic/platform=iOS' \
            -archivePath build/KDEConnect.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Package the IPA
        run: |
          mkdir -p build/Payload
          cp -R 'build/KDEConnect.xcarchive/Products/Applications/KDE Connect.app' build/Payload/
          cd build && zip -qry KDEConnect-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: KDEConnect-unsigned-ipa
          path: build/KDEConnect-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
